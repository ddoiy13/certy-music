name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$PKG_VERSION"
            exit 1
          fi

      - run: npm ci

      - run: npm test

      - run: npm run dist

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          case "$GITHUB_REF_NAME" in
            *-*) FLAGS="--prerelease" ;;
          esac

          # 자동 노트를 생성한 뒤 "New Contributors" 섹션만 제거한다
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > notes-raw.md
          node -e '
            const fs = require("fs");
            const text = fs.readFileSync("notes-raw.md", "utf8");
            const out = text.replace(/^## New Contributors\r?\n[\s\S]*?(?=^\*\*Full Changelog\*\*|(?![\s\S]))/m, "");
            fs.writeFileSync("notes.md", out);
          '

          gh release create "$GITHUB_REF_NAME" \
            "dist/CertyMusic-Setup.exe" \
            "dist/CertyMusic-Setup.exe.blockmap" \
            "dist/latest.yml" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            $FLAGS
